<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT@0,9..144,300..700,0..100;1,9..144,300..700,0..100&family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;} body{margin:0;background:#3A352F;} a{color:#8C7344;text-decoration:none;} a:hover{color:#A53F3F;}
  @keyframes hh-reel-mark { 0%{opacity:0;transform:scale(0.62);} 18%,86%{opacity:1;transform:scale(1);} 100%{opacity:0;transform:scale(1.06);} }
  @keyframes hh-reel-rise { 0%{opacity:0;transform:translateY(34px);} 24%,84%{opacity:1;transform:translateY(0);} 100%{opacity:0;transform:translateY(-16px);} }
  @keyframes hh-reel-rule { 0%,22%{transform:scaleX(0);} 40%,84%{transform:scaleX(1);} 100%{transform:scaleX(1);opacity:0;} }
  @media (prefers-reduced-motion: reduce){ .hh-reel-mark,.hh-reel-rise,.hh-reel-rule{animation:none!important;} .hh-reel-mark,.hh-reel-rise{opacity:1!important;transform:none!important;} .hh-reel-rule{transform:scaleX(1)!important;} }
</style>
</helmet>
<div style="--gold:#B89968;--gold-deep:#8C7344;--gold-light:#DDC9A3;--wood:#7A8B6F;--wood-deep:#4D5B45;--water:#7BA7A6;--earth:#C97B5C;--fire:#A53F3F;--fire-soft:#C26565;--cream:#F5EEE0;--cream-light:#FAF6EE;--cream-deep:#ECE2CE;--stone:#A89F92;--charcoal:#252220;--charcoal-soft:#3A352F;--handle:#7A756C;--near-black:#211F1C;--cream-social:#F9F5EC;--font-display:'Fraunces',Georgia,serif;--font-body:'Manrope',-apple-system,'Segoe UI',sans-serif; width:1080px; height:1920px; background:var(--charcoal); background-image:radial-gradient(circle at 50% 42%, rgba(184,153,104,0.14) 0%, transparent 60%); display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:120px; font-family:var(--font-body);">
  <div class="hh-reel-mark" style="width:300px; height:300px; margin-bottom:60px; animation:hh-reel-mark 6s cubic-bezier(0.4,0,0.2,1) infinite;"><dc-import name="Mark" color="#DDC9A3" hint-size="300px,300px" style="width:300px;height:300px;"></dc-import></div>
  <div class="hh-reel-rise" style="animation:hh-reel-rise 6s cubic-bezier(0.4,0,0.2,1) infinite; animation-delay:0.3s;">
    <div style="font-family:var(--font-display); font-style:italic; font-weight:400; font-size:92px; line-height:1; color:var(--cream-social); font-variation-settings:'SOFT' 70; margin-bottom:28px;">{{ brandName }}</div>
    <div class="hh-reel-rule" style="width:160px; height:5px; background:var(--gold); margin:0 auto 32px; transform-origin:center; animation:hh-reel-rule 6s cubic-bezier(0.4,0,0.2,1) infinite;"></div>
    <div style="font-family:var(--font-body); font-size:30px; font-weight:600; letter-spacing:4px; text-transform:uppercase; color:var(--gold-light);">{{ tagline }}</div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1080,&quot;height&quot;:1920},&quot;brandName&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;The Healing Haven&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;tagline&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Therapy \u00b7 Helen deLovely, LCSW&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    return {
      brandName: p.brandName ?? 'The Healing Haven',
      tagline: p.tagline ?? 'Therapy \u00b7 Helen deLovely, LCSW',
    };
  }
}
</script>
</body>
</html>
