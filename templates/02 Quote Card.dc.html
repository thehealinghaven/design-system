<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT@0,9..144,300..700,0..100;1,9..144,300..700,0..100&family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>*{box-sizing:border-box;}body{margin:0;background:#3A352F;}a{color:#8C7344;text-decoration:none;}a:hover{color:#A53F3F;}</style>
</helmet>
<div style="--gold:#B89968;--gold-deep:#8C7344;--gold-light:#DDC9A3;--wood:#7A8B6F;--wood-deep:#4D5B45;--water:#7BA7A6;--earth:#C97B5C;--fire:#A53F3F;--fire-soft:#C26565;--cream:#F5EEE0;--cream-light:#FAF6EE;--cream-deep:#ECE2CE;--stone:#A89F92;--charcoal:#252220;--charcoal-soft:#3A352F;--handle:#7A756C;--near-black:#211F1C;--cream-social:#F9F5EC;--font-display:'Fraunces',Georgia,serif;--font-body:'Manrope',-apple-system,'Segoe UI',sans-serif; width:1080px; height:1080px; background:{{ bg }}; display:flex; flex-direction:column; justify-content:space-between; padding:90px; font-family:var(--font-body);">
  <div style="display:flex; justify-content:space-between; align-items:flex-start;">
    <div style="width:88px; height:88px;"><dc-import name="Mark" color="{{ markColor }}" hint-size="88px,88px" style="width:88px;height:88px;"></dc-import></div>
    <span style="font-family:var(--font-display); font-style:italic; font-size:120px; line-height:0.7; color:{{ accent }}; opacity:0.5;">&rdquo;</span>
  </div>
  <blockquote style="margin:0;">
    <p style="margin:0 0 34px; font-family:var(--font-display); font-style:italic; font-weight:450; font-size:68px; line-height:1.2; letter-spacing:-0.01em; color:{{ ink }}; font-variation-settings:'SOFT' 60;">{{ quote }}</p>
    <div style="width:96px; height:5px; background:{{ accent }};"></div>
  </blockquote>
  <div style="display:flex; justify-content:space-between; align-items:flex-end;">
    <div style="font-family:var(--font-display); font-size:38px; color:{{ ink }}; font-variation-settings:'SOFT' 60;">{{ brandName }}</div>
    <div style="font-family:var(--font-body); font-size:22px; font-weight:600; letter-spacing:2px; text-transform:uppercase; color:{{ handleColor }};">{{ handle }}</div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1080,&quot;height&quot;:1080},&quot;colorway&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;Light&quot;,&quot;options&quot;:[&quot;Light&quot;,&quot;Dark&quot;],&quot;tsType&quot;:&quot;string&quot;},&quot;quote&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Healing isn't linear. Some weeks you just hold steady \u2014 that counts too.&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;handle&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;@helendelovelylcsw&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;brandName&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;The Healing Haven&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const dark = (p.colorway ?? 'Light') === 'Dark';
    return {
      quote: p.quote ?? "Healing isn't linear. Some weeks you just hold steady \u2014 that counts too.",
      brandName: p.brandName ?? 'The Healing Haven',
      handle: p.handle ?? '@helendelovelylcsw',
      bg: dark ? 'var(--charcoal)' : 'var(--cream)',
      ink: dark ? 'var(--cream-social)' : 'var(--near-black)',
      accent: dark ? 'var(--gold-light)' : 'var(--gold)',
      markColor: dark ? '#DDC9A3' : '#B89968',
      handleColor: dark ? 'rgba(221,201,163,0.85)' : 'var(--handle)',
    };
  }
}
</script>
</body>
</html>
