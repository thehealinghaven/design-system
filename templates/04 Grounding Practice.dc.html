<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT@0,9..144,300..700,0..100;1,9..144,300..700,0..100&family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>*{box-sizing:border-box;}body{margin:0;background:#3A352F;}a{color:#8C7344;text-decoration:none;}a:hover{color:#A53F3F;}</style>
</helmet>
<div style="--gold:#B89968;--gold-deep:#8C7344;--gold-light:#DDC9A3;--wood:#7A8B6F;--wood-deep:#4D5B45;--water:#7BA7A6;--earth:#C97B5C;--fire:#A53F3F;--fire-soft:#C26565;--cream:#F5EEE0;--cream-light:#FAF6EE;--cream-deep:#ECE2CE;--stone:#A89F92;--charcoal:#252220;--charcoal-soft:#3A352F;--handle:#7A756C;--near-black:#211F1C;--cream-social:#F9F5EC;--font-display:'Fraunces',Georgia,serif;--font-body:'Manrope',-apple-system,'Segoe UI',sans-serif; width:1080px; height:1350px; background:var(--cream); display:flex; flex-direction:column; padding:90px; font-family:var(--font-body);">
  <div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:50px;">
    <div style="width:100px; height:100px;"><dc-import name="Mark" color="#7BA7A6" hint-size="100px,100px" style="width:100px;height:100px;"></dc-import></div>
    <span style="font-family:var(--font-body); font-size:22px; font-weight:700; letter-spacing:3px; text-transform:uppercase; color:var(--cream-social); background:var(--water); padding:13px 24px; border-radius:100px;">{{ kicker }}</span>
  </div>
  <h3 style="margin:0 0 12px; font-family:var(--font-display); font-style:italic; font-weight:450; font-size:76px; line-height:1.05; letter-spacing:-0.01em; color:var(--near-black); font-variation-settings:'SOFT' 60;">{{ title }}</h3>
  <p style="margin:0 0 46px; font-family:var(--font-body); font-size:30px; line-height:1.5; color:var(--charcoal-soft);">{{ intro }}</p>
  <div style="display:flex; flex-direction:column; gap:22px;">
    <sc-for list="{{ steps }}" as="step" hint-placeholder-count="4">
      <div style="display:flex; align-items:center; gap:30px; border-top:2px solid var(--cream-deep); padding-top:22px;">
        <span style="font-family:var(--font-display); font-style:italic; font-size:60px; color:var(--water); width:90px; font-variation-settings:'SOFT' 100;">{{ step.n }}</span>
        <span style="font-family:var(--font-body); font-size:38px; font-weight:500; color:var(--near-black); flex:1;">{{ step.label }}</span>
        <span style="font-family:var(--font-body); font-size:32px; font-weight:700; letter-spacing:2px; text-transform:uppercase; color:var(--handle);">{{ step.count }}</span>
      </div>
    </sc-for>
  </div>
  <div style="flex:1;"></div>
  <div style="display:flex; justify-content:space-between; align-items:flex-end; margin-top:40px;">
    <div style="font-family:var(--font-display); font-size:34px; color:var(--near-black); font-variation-settings:'SOFT' 60;">{{ brandName }}</div>
    <div style="font-family:var(--font-display); font-size:26px; font-style:italic; color:var(--water);">{{ close }}</div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1080,&quot;height&quot;:1350},&quot;kicker&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;A practice for now&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Box breathing&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;intro&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;When your mind is racing, give it one simple thing to follow.&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;close&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Repeat for one minute.&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;brandName&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;The Healing Haven&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;steps&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;{n:string,label:string,count:string}[]&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    return {
      kicker: p.kicker ?? 'A practice for now',
      title: p.title ?? 'Box breathing',
      intro: p.intro ?? 'When your mind is racing, give it one simple thing to follow.',
      brandName: p.brandName ?? 'The Healing Haven',
      close: p.close ?? 'Repeat for one minute.',
      steps: p.steps ?? [
        { n: '01', label: 'Breathe in', count: '4 counts' },
        { n: '02', label: 'Hold it', count: '4 counts' },
        { n: '03', label: 'Breathe out', count: '4 counts' },
        { n: '04', label: 'Hold again', count: '4 counts' },
      ],
    };
  }
}
</script>
</body>
</html>
