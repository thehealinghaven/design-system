<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<!-- @template name="Referral card" description="3.5×2in two-sided referral card — book-a-consultation CTA with a write-in referred-by line; brand mark on the back" -->
<helmet><script src="./ds-base.js"></script><script src="./doc-page.js"></script><style>doc-page:not(:defined){visibility:hidden}a{color:#8C7344;text-decoration:none}a:hover{color:#A53F3F}</style></helmet>
<doc-page width="3.5in" height="2in">
<section class="page" data-screen-label="01 Front">
<div style="position:absolute;inset:0;background:#FAF6EE;padding:0.24in 0.26in;display:flex;flex-direction:column;justify-content:space-between;box-sizing:border-box">
<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:0.2in">
<div style="display:flex;flex-direction:column;gap:6pt">
<div style="font-family:'Manrope',sans-serif;font-size:6.5pt;font-weight:600;letter-spacing:0.22em;text-transform:uppercase;color:#8C7344">You've been referred</div>
<div style="font-family:'Fraunces',Georgia,serif;font-variation-settings:'SOFT' 50,'opsz' 72;font-weight:350;font-size:19pt;line-height:1.02;letter-spacing:-0.01em;color:#252220">Book a<br>consultation</div>
</div>
<img src="../../assets/logos/mark-v2-gold.svg" alt="The Healing Haven mark" style="width:0.34in;height:0.34in;display:block;flex-shrink:0">
</div>
<div style="display:flex;flex-direction:column;gap:9pt">
<div style="display:flex;align-items:flex-end;gap:5pt;font-family:'Fraunces',Georgia,serif;font-style:italic;font-size:7.5pt;color:#7A756C"><span style="white-space:nowrap">Referred by</span><span style="flex:1;border-bottom:0.5pt solid #A89F92;height:9pt"></span></div>
<div style="display:flex;justify-content:space-between;align-items:baseline;gap:0.15in;padding-top:6pt;border-top:0.5pt solid #ECE2CE">
<span style="font-family:'Manrope',sans-serif;font-size:9pt;font-weight:600;letter-spacing:0.01em;color:#252220">helendelovely.com/consult</span>
<span style="font-family:'Manrope',sans-serif;font-size:9pt;color:#A53F3F">→</span>
</div>
</div>
</div>
</section>
<section class="page" data-screen-label="02 Back">
<div style="position:absolute;inset:0;background:#252220;padding:0.22in 0.24in;display:flex;gap:0.18in;box-sizing:border-box">
<div style="flex:1;min-width:0;display:flex;flex-direction:column;justify-content:space-between">
<div style="display:flex;flex-direction:column;gap:6pt">
<img src="../../assets/logos/mark-v2-gold-light.svg" alt="The Healing Haven mark" style="width:0.36in;height:0.36in;display:block">
<div style="font-family:'Fraunces',Georgia,serif;font-variation-settings:'SOFT' 50,'opsz' 72;font-weight:350;font-size:13pt;line-height:1;letter-spacing:-0.005em;color:#F5EEE0">The Healing Haven</div>
<div style="font-family:'Manrope',sans-serif;font-size:5.5pt;font-weight:600;letter-spacing:0.18em;line-height:1.65;text-transform:uppercase;color:#DDC9A3">Neurodivergent &amp; LGBTQ+<br>affirming therapy in<br>Salt Lake City, Utah</div>
</div>
<div style="display:flex;flex-direction:column;gap:2pt;padding-top:5pt;border-top:0.5pt solid rgba(245,238,224,0.16)">
<div style="font-family:'Fraunces',Georgia,serif;font-size:8.5pt;color:#F5EEE0">Helen De-Lovely<span style="color:rgba(245,238,224,0.6)">, LCSW</span></div>
<div style="font-family:'Manrope',sans-serif;font-size:7pt;color:#DDC9A3">helendelovely.com</div>
</div>
</div>
<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5pt;flex-shrink:0">
<img src="../../assets/qr/consult-qr.svg" alt="QR code to helendelovely.com/consult" style="width:0.82in;height:0.82in;display:block;border-radius:2pt">
<div style="font-family:'Manrope',sans-serif;font-size:5.5pt;font-weight:600;letter-spacing:0.2em;text-transform:uppercase;color:#DDC9A3">Scan to book</div>
</div>
</div>
</section>
</doc-page>
</x-dc>
</body>
</html>
