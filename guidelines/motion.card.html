<!-- @dsCard group="Foundations" viewport="700x200" name="Motion tempos" subtitle="Tempo A 0.2–0.4s interface · Tempo B 5–18s ambient. Slow, eased, settled — never bounce" -->
<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>body{padding:0;background:var(--cream);font-family:var(--font-body)}</style></head><body><div style="padding:22px 24px;display:grid;grid-template-columns:1fr 1fr;gap:18px">
<div style="background:var(--cream-light);border:1px solid var(--cream-deep);border-radius:4px;padding:18px 20px">
<div style="font-size:10px;font-weight:600;letter-spacing:0.2em;text-transform:uppercase;color:var(--gold-deep);margin-bottom:8px">Tempo A · interface</div>
<div style="font-family:var(--font-display);font-style:italic;font-size:22px;color:var(--charcoal);font-variation-settings:'SOFT' 100;margin-bottom:8px">0.2 – 0.4s</div>
<div style="font-size:11px;color:var(--stone)">cubic-bezier(0.25, 0.1, 0.25, 1) · fades and 1–2px lifts</div></div>
<div style="background:var(--charcoal);border-radius:4px;padding:18px 20px;position:relative;overflow:hidden">
<div class="hh-breathe" style="position:absolute;right:-40px;top:50%;margin-top:-70px;width:140px;height:140px;border:1px solid rgba(221,201,163,0.5);border-radius:50%;animation:hh-breathe 18s ease-in-out infinite"></div>
<div style="font-size:10px;font-weight:600;letter-spacing:0.2em;text-transform:uppercase;color:var(--gold-light);margin-bottom:8px">Tempo B · ambient</div>
<div style="font-family:var(--font-display);font-style:italic;font-size:22px;color:var(--cream);font-variation-settings:'SOFT' 100;margin-bottom:8px">5 – 18s</div>
<div style="font-size:11px;color:rgba(245,238,224,0.6)">Breathing rings, reel reveals, word-by-word blur-to-sharp</div></div>
</div></body></html>
