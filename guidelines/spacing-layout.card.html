<!-- @dsCard group="Spacing" viewport="700x240" name="Layout rhythm in use" subtitle="1180px measure, 40px gutter, 22px eyebrow-to-title, 48px body-to-grid, 66ch prose" -->
<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>body{padding:0;background:var(--cream);font-family:var(--font-body)}</style></head><body><div style="padding:20px 22px">
<div style="border:1px dashed var(--gold);border-radius:4px;padding:18px 20px;background:var(--cream-light)">
<div style="font-size:11px;font-weight:500;letter-spacing:0.28em;text-transform:uppercase;color:var(--gold-deep);margin-bottom:12px">— Section eyebrow</div>
<div style="font-family:var(--font-display);font-size:26px;line-height:1.05;color:var(--charcoal);font-variation-settings:'SOFT' 50;margin-bottom:12px">Title sits at 22ch max</div>
<p style="margin:0 0 16px;font-size:13px;line-height:1.65;color:var(--charcoal-soft);max-width:66ch">Body copy is capped at 66ch. The gap from eyebrow to title is 22px, title to body 16px, body to the content grid 48px.</p>
<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px"><div style="height:34px;background:var(--cream-deep);border-radius:4px"></div><div style="height:34px;background:var(--cream-deep);border-radius:4px"></div><div style="height:34px;background:var(--cream-deep);border-radius:4px"></div></div>
</div></div></body></html>
