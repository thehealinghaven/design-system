<!-- @dsCard group="Colors" viewport="700x160" name="The 60 · 30 · 10 rule" subtitle="60% cream, 30% deep neutrals, ~8% gold, fire at 1–2% — like a wax seal on a letter" -->
<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>body{padding:0;background:var(--cream);font-family:var(--font-body)}</style></head><body><div style="padding:24px 22px">
<div style="display:flex;height:52px;border-radius:4px;overflow:hidden;margin-bottom:12px">
<div style="width:60%;background:var(--cream-deep);display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--charcoal-soft)">60% cream foundation</div>
<div style="width:30%;background:var(--wood-deep);display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--cream)">30% deep neutrals</div>
<div style="width:8%;background:var(--gold)"></div><div style="width:2%;background:var(--fire)"></div></div>
<p style="margin:0;font-size:13px;line-height:1.6;color:var(--charcoal-soft)">Gold never sits on pure white — it loses its warmth. Pull no more than two element colors into one layout.</p></div></body></html>
