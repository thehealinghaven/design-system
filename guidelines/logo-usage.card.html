<!-- @dsCard group="Brand" viewport="700x200" name="Mark — always gold" subtitle="Gold on cream, gold-light on dark. Never recolored, never on pure white" -->
<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>body{padding:0;background:var(--cream);font-family:var(--font-body)}</style></head><body><div style="padding:22px;display:grid;grid-template-columns:1fr 1fr 1.4fr;gap:16px">
<div style="background:var(--cream);border:1px solid var(--cream-deep);border-radius:4px;padding:18px;display:flex;flex-direction:column;align-items:center;gap:10px"><img src="../assets/logos/mark-gold.svg" alt="mark" style="width:62px;height:62px"><span style="font-size:10px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:var(--wood-deep)">&#10003; Gold on cream</span></div>
<div style="background:var(--charcoal);border-radius:4px;padding:18px;display:flex;flex-direction:column;align-items:center;gap:10px"><img src="../assets/logos/mark-gold-light.svg" alt="mark" style="width:62px;height:62px"><span style="font-size:10px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:var(--gold-light)">&#10003; Gold-light on dark</span></div>
<ul style="margin:0;padding-left:18px;font-size:12px;line-height:1.75;color:var(--charcoal-soft);align-self:center"><li>Never recolor the mark — no red, green, or seasonal variants.</li><li>Never place gold on pure white.</li><li>Accent color lives in kicker pills and footer rules, never the mark.</li></ul>
</div></body></html>
