<!DOCTYPE html><html><head><meta charset="utf-8"><title>The Healing Haven — site kit</title>
<link rel="stylesheet" href="../../styles.css">
<style>body{background:var(--cream)}#root{min-height:100vh}</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
</head><body><div id="root"></div>
<script type="text/babel" src="Chrome.jsx"></script>
<script type="text/babel" src="Home.jsx"></script>
<script type="text/babel" src="Pages.jsx"></script>
<script type="text/babel" src="Consult.jsx"></script>
<script type="text/babel">
const { Home, Stub, Consult, SiteNav, SiteFooter } = window;
const STUBS = {
  'membership': { eyebrow: 'Membership', title: 'Membership', tail: ' — page not yet modeled.' },
  'packages': { eyebrow: 'Packages', title: 'Packages', tail: ' — page not yet modeled.' },
  'clinical-training': { eyebrow: 'Clinical training', title: 'Clinical training', tail: ' — page not yet modeled.' },
  'hiring': { eyebrow: 'Hiring', title: 'Hiring', tail: ' — page not yet modeled.' },
  'blog': { eyebrow: 'Blog', title: 'Blog', tail: ' — page not yet modeled.' },
  'contact': { eyebrow: 'Contact', title: 'Contact', tail: ' — page not yet modeled.' },
  'schedule-medicaid': { eyebrow: 'Schedule Medicaid', title: 'Schedule Medicaid', tail: ' — page not yet modeled.' },
};
function App() {
  const [route, setRoute] = React.useState('home');
  const go = (r) => { setRoute(r); window.scrollTo({ top: 0, behavior: 'smooth' }); };
  return (
    <div>
      <SiteNav route={route} go={go} />
      {route === 'home' && <Home go={go} />}
      {STUBS[route] && <Stub {...STUBS[route]} go={go} />}
      {route === 'consult' && <Consult />}
      {route === 'portal' && <div style={{maxWidth:'var(--measure)',margin:'0 auto',padding:'var(--section-y) var(--gutter-page)'}}>
        <p style={{fontFamily:'var(--font-display)',fontStyle:'italic',fontSize:'28px',color:'var(--charcoal)',fontVariationSettings:"'SOFT' 100"}}>The member portal lives in <a href="../portal/index.html">ui_kits/portal</a>.</p></div>}
      <SiteFooter />
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
